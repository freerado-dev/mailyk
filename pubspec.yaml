name: konverzo_mail
description: Emailový klient s konverzačným zobrazením podľa odosielateľa.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  enough_mail: ^2.1.6
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  flutter_widget_from_html_core: ^0.15.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
